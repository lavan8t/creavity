name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Desktop unit tests
        run: ./gradlew :app:desktopTest --console=plain

      - name: Desktop target compiles
        run: ./gradlew :app:compileKotlinDesktop --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/tests/desktopTest

  release-linux:
    name: Build & Release Linux RPM & Universal Tarball
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install RPM packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package Release RPM & Distributable
        run: ./gradlew :app:packageReleaseRpm :app:createReleaseDistributable --console=plain

      - name: Package Universal Tarball
        run: |
          mkdir -p build/package-tar/creavity-1.2.0
          cp -r app/build/compose/binaries/main-release/app/CreaVITy/* build/package-tar/creavity-1.2.0/
          cp scripts/install.sh build/package-tar/creavity-1.2.0/install.sh
          cp app/src/desktopMain/resources/icon.png build/package-tar/creavity-1.2.0/icon.png
          chmod +x build/package-tar/creavity-1.2.0/install.sh build/package-tar/creavity-1.2.0/bin/CreaVITy
          tar -czf app/build/compose/binaries/main-release/creavity-1.2.0-linux-x86_64.tar.gz -C build/package-tar creavity-1.2.0

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CreaVITy-linux-packages
          path: |
            app/build/compose/binaries/**/rpm/*.rpm
            app/build/compose/binaries/**/*.tar.gz

      - name: Upload Packages to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TARGET_TAG="$GITHUB_REF_NAME"
          else
            TARGET_TAG=$(gh release view -R ${{ github.repository }} --json tagName -q .tagName)
          fi

          if [ -z "$TARGET_TAG" ]; then
            echo "Error: Could not determine target release tag in ${{ github.repository }}."
            exit 1
          fi

          echo "Target GitHub release tag: $TARGET_TAG"
          RPM_FILE=$(find app/build/compose/binaries -name "*.rpm" | head -n 1)
          TAR_FILE=$(find app/build/compose/binaries -name "*.tar.gz" | head -n 1)
          if [ -z "$RPM_FILE" ] || [ -z "$TAR_FILE" ]; then
            echo "Error: Linux package files not found"
            exit 1
          fi

          echo "Uploading $RPM_FILE and $TAR_FILE to release $TARGET_TAG"
          gh release upload -R ${{ github.repository }} "$TARGET_TAG" "$RPM_FILE" "$TAR_FILE" --clobber

  release-desktop:
    name: Build & Release Windows EXE
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Add WiX to PATH
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\WiX Toolset v3.11\bin") {
            "C:\Program Files (x86)\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } elseif (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.11.2 -y
          }

      - name: Package Release EXE
        shell: pwsh
        run: .\gradlew.bat :app:packageReleaseExe --console=plain

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreaVITy-windows-exe
          path: app/build/compose/binaries/**/exe/*.exe

      - name: Upload EXE to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $targetTag = ""
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $targetTag = $env:GITHUB_REF_NAME
          } else {
            $targetTag = gh release view -R ${{ github.repository }} --json tagName -q .tagName
          }

          if (-not $targetTag) {
            Write-Error "Could not determine target release tag in ${{ github.repository }}."
            exit 1
          }

          Write-Host "Target GitHub release tag: $targetTag"
          $exeFiles = Get-ChildItem -Path app/build/compose/binaries -Filter "*.exe" -Recurse | Where-Object { $_.DirectoryName -split '[\\/]' -contains 'exe' }
          if (-not $exeFiles) {
            Write-Error "No .exe found in app/build/compose/binaries/**/exe/"
            exit 1
          }
          foreach ($file in $exeFiles) {
            Write-Host "Uploading $($file.FullName) to release $targetTag"
            gh release upload -R ${{ github.repository }} $targetTag $file.FullName --clobber
          }
